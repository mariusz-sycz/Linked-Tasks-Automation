      primary_language: TypeScript
      complexity: moderate
      summary: "Feature integrates at a single seam (templateBuilder.ts:22-24 after placeholder substitution) via a new synchronous expressionEvaluator.ts; analysis recommends an allowlisted hand-rolled evaluator with an explicit opt-in marker and hardening of replaceReferenceToParentField; no build/transport changes required."
      decisions:
        - {decision: "New module src/scripts/expressionEvaluator.ts, called from templateBuilder.ts right after placeholder substitution", rationale: "matches the one-concern-per-file pattern; templateFilters.ts is already the largest file and is about filtering, not value transformation"}
        - {decision: "Hand-rolled allowlisted evaluator (numeric literals, + - * / % ( ), fixed Math.* subset) rather than new Function/eval", rationale: "avoids the unverified unsafe-eval CSP question in the sandboxed extension iframe, satisfies validation.md (allowlists over blocklists), and needs no npm dependency"}
        - {decision: "Explicit opt-in marker for expression evaluation (e.g. leading =)", rationale: "the existing @me / @currentiteration sentinels in IsPropertyValid are the precedent for special value syntax; auto-detection would corrupt free-text fields"}
        - {decision: "Emit a native number when evaluation succeeds; fall back to the substituted string (and logError) on any failure", rationale: "never throw out of the template pipeline, consistent with the project's catch/log/degrade error philosophy"}
        - {decision: "Fix replaceReferenceToParentField to replace all occurrences and detect unresolved fields as part of this work", rationale: "{A}+{A} and missing fields are the two most likely real-world failure modes for arithmetic"}
      risks:
        - "Marker syntax is unspecified by the task (Math.ceil({...}*2) with no prefix) — needs a decision: explicit prefix (recommended) vs. heuristic detection."
        - "Whether the sandboxed Azure DevOps extension iframe permits new Function is unverified; only relevant if the allowlist approach is rejected."
        - "Result typing: value: 5 vs value: \"5\" — ADO accepts both for numeric fields, but \"NaN\"/\"undefined\" cause a 400 that surfaces only as a failed entry in the completion dialog with no reason shown to the user."
        - "No test infrastructure exists (task state has skip_test_suite: true); adding Jest requires a second tsconfig because module: amd won't run under Jest."
        - "Templates are cached in localStorage for 4 hours (templateCache.ts) — manual verification must clear linkedTasksAutomation.templateCache.* keys."
        - "Uncommitted work on main (TemplateOutcome refactor, bundler, docs rewrite of overview.md) — low collision risk for code, but the new docs section must land in the rewritten structure of both README.md and src/overview.md."
        - "Two structural quirks in the substitution regex: it matches text before } without requiring {, and String.replace with a string pattern only replaces the first occurrence."
      artifacts:
        - {path: analysis/codebase-analysis.md, label: "Codebase analysis", html: null}
    clarifications:
      - {question: "Evaluation mechanism", answer: "Safe arithmetic subset (hand-rolled allowlisted evaluator: numbers, + - * / % ( ), Math.ceil/floor/round/abs/min/max/pow); no new Function/eval"}
      - {question: "Expression marker", answer: "Leading = prefix on the template field value"}
      - {question: "Missing parent field / evaluation failure", answer: "Log error (template, field, expression) and skip the field; child work item is still created"}
      - {question: "Tests", answer: "Yes - add Jest + ts-jest (test-only CommonJS tsconfig), npm test script, unit tests for evaluator and placeholder substitution"}
