task:
  title: "Arithmetic expressions in template field values"
  description: "Allow template authors to write arithmetic/JavaScript-style expressions in template field values, e.g. \"Math.ceil({Microsoft.VSTS.Scheduling.StoryPoints}*2)\". Field placeholders are substituted with parent work item values, then the expression is parsed as a function and evaluated like standard JavaScript code, with the result written to the child work item field."
  status: completed
  tags: [templates, field-inheritance, expressions]
  priority: medium

