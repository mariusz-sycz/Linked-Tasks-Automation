task:
  title: "Speed up task creation, add progress feedback, fix popup-close reliability, modularize app.ts"
  status: completed
  description: >
    Implement the design from research task 2026-08-08-speed-up-task-creation:
    (1) reduce click-to-first-task delay via localStorage template caching (4h TTL),
    parallelizing getTeamSettings/getWorkItem, and bounded parallelization of the
    per-template create loop (independent vs. justCreatedTasks-ordered groups);
    (2) give visible progress feedback via two IHostDialogService.openMessageDialog
    calls (start/completion summary); (3) fix popup-close reliability by switching
    create/link REST calls from the wrapped SDK client to raw fetch(keepalive:true)
    with a bearer token from VSS.getAccessToken() — no new contribution surface,
    per the research's high-level-design.md (ADR-001 through ADR-005).
    PLUS (user-added mid-Phase-1 scope): split the entire single-file
    src/scripts/app.ts (629 lines) into a proper multi-file module structure —
    not just the 5 new/changed pieces from the research design, but the whole
    file including currently-untouched functions. The prior, separately-tracked
    TypeScript migration task ported app.js to app.ts but kept it monolithic;
    modularization was out of that task's scope and is net-new here.
  tags: [performance, ux, reliability, azure-devops-extension]
  priority: high

task_context:
  risk_level: high
  clarifications_resolved: true
  scope_expanded: true
  tech_clarified: true
  architecture_decision:
    decision: "No new contribution surface — point-fixes within the existing single ms.vss-web.action contribution"
    summary: >
      fetch(keepalive:true) replaces the wrapped REST client for creates/links;
      localStorage + 4h TTL template caching; two openMessageDialog calls for
      start/completion progress feedback (no programmatic auto-close achievable);
      getTeamSettings/getWorkItem parallelized; template creates split into
      independent (parallel) and ordered (justCreatedTasks-dependent, sequential) groups.
  task_characteristics:
    has_reproducible_defect: true
    modifies_existing_code: true
    creates_new_entities: true
    involves_data_operations: true
    ui_heavy: false

  research_reference:
    path: .maister/tasks/research/2026-08-08-speed-up-task-creation
    research_question: >
      How can we speed up child work item creation in the Linked Tasks Automation extension
      (async template preloading/caching, async creation, async linking), give users visible
      non-blocking progress feedback, and fix task creation breaking when the work item is
      opened in an Azure DevOps popup panel so creation survives popup close and only a full
      page refresh stops it?
    research_type: mixed
    confidence_level: medium

  design_reference:
    source: null
    product_design_path: null
    mockup_count: 0
    has_brief: false
    index_path: null

  project_doc_paths:
    - .maister/docs/project/vision.md
    - .maister/docs/project/roadmap.md
    - .maister/docs/project/tech-stack.md

  phase_summaries:
    research:
      summary: >
        Root cause of all 3 sub-questions: the extension's single ms.vss-web.action
        contribution has no pre-click load moment, no visible DOM, and is torn down
        on hosting dialog close, aborting in-flight REST calls. Chosen design (per
        explicit user convergence, overriding the exploration's Hybrid-architecture
        recommendation): no new contribution surface. localStorage+TTL caching,
        fetch(keepalive:true) for creates/links, two modal dialogs for progress,
        bounded parallelization of independent reads and non-ordering-dependent
        template creates.
      key_findings:
        - "Entire creation flow is one sequential Q-promise chain, zero UI feedback (High confidence)"
        - "getTeamSettings/getWorkItem are independent but nested — safe to parallelize (High confidence)"
        - "Per-template create loop over-serialized; only justCreatedTasks-dependent templates need ordering (High confidence)"
        - "localStorage survives toolbar iframe teardown; recommended caching mechanism (High confidence)"
        - "No built-in control renders visible non-blocking progress for this contribution type (High confidence)"
        - "Form-scoped contributions (this extension's type) are documented as torn down on dialog close (Medium-High confidence, not live-verified)"
        - "Iframe removal aborts in-flight fetch/XHR — standard browser behavior (Medium-High confidence)"
        - "fetch(keepalive:true) survives iframe teardown but cannot chain on the response afterward — ordering-dependent creates and link-to-parent calls not yet dispatched remain exposed to popup close (accepted limitation, ADR-002)"
      recommended_approach: >
        No new contribution surface (ADR-001); fetch(keepalive:true) for creates/links (ADR-002);
        localStorage + 4h TTL caching (ADR-003); two openMessageDialog calls for progress (ADR-004);
        bounded dependency-aware parallelization (ADR-005).
      decisions:
        - decision: "No new contribution surface; Hub/Hybrid architecture explicitly rejected for this iteration"
          rationale: "ADR-001 — explicit user convergence favoring simplicity over solution-exploration.md's top recommendation"
        - decision: "fetch(keepalive:true) with VSS.getAccessToken() bearer token replaces wrapped client for creates/links only"
          rationale: "ADR-002 — the only mechanism that survives iframe teardown on popup close; reads stay on the existing wrapped client"
        - decision: "localStorage + 4h TTL for template caching, lazy population"
          rationale: "ADR-003 — no template-save event exists in Azure DevOps extensibility points or Service Hooks catalog (confirmed infeasible)"
        - decision: "Two openMessageDialog calls (start/completion) for progress feedback, no programmatic auto-close"
          rationale: "ADR-004 — the confirmed API (IHostDialogService) has no IExternalDialog close handle; one-click-dismiss shipped for v1"
        - decision: "getTeamSettings/getWorkItem parallelized; template creates split into independent (parallel) and ordered (sequential, justCreatedTasks-dependent) groups"
          rationale: "ADR-005 — safe concurrency without changing existing template linking behavior"
      risks:
        - "Popup-close survival is NOT guaranteed for: (1) ordered-group template creates not yet dispatched when the popup closes, (2) any template's link-to-parent/ToAllOtherChilds link call not yet dispatched — must be communicated as actual behavior, not full guarantee"
        - "Exact REST endpoint paths/api-version for fetch-based create/link calls must be confirmed at implementation time via devtools network capture against the wrapped client's actual calls — not guessed"
        - "openMessageDialog auto-dismiss after ~5s is not implementable against the confirmed SDK API; flagged as a non-blocking follow-up spike (self-closing jQuery content), not built for v1"
        - "Popup-close root cause (Finding 8) is a documented category contrast, not live-verified in a real Azure DevOps org — recommend live verification before/during implementation"
      artifacts:
        - path: analysis/research-context/research-report.md
          label: "Research Report (from research task)"
          html: null
        - path: analysis/research-context/solution-exploration.md
          label: "Solution Exploration (from research task)"
          html: null
        - path: analysis/research-context/high-level-design.md
          label: "High-Level Design (from research task)"
          html: null
        - path: analysis/research-context/decision-log.md
          label: "Decision Log / ADRs (from research task)"
          html: null
    design: {summary: null, screen_count: 0, component_count: 0, index_path: null}
    codebase_analysis:
      key_files: ["src/scripts/app.ts", "src/toolbar.html", "src/tsconfig.json", "src/vss-extension.json"]
      primary_language: "TypeScript"
      summary: >
        All 5 changes land in the single 629-line src/scripts/app.ts (sole consumer:
        toolbar.html). Every research line reference re-verified with zero drift.
        fetch/localStorage/native Promise work with no tsconfig changes. VSS.getAccessToken()
        and IHostDialogService.openMessageDialog() are greenfield (zero existing usage).
        Zero automated tests exist — verification will be manual via grunt serve + live ADO org.
      decisions:
        - decision: "Base 'ordered group' sequencing on justCreatedTasks.push() timing, not link-write completion"
          rationale: "Existing code already doesn't wait for linkItems calls to resolve before the chain proceeds — preserving that pre-existing non-waiting behavior is the correct backward-compatible baseline"
        - decision: "No tsconfig.json changes needed for fetch/localStorage/native Promise"
          rationale: "DOM lib is included by default under target: ES2015 with no explicit lib override"
        - decision: "Leave the pre-existing GetChildTypes bugsBehavior enum-vs-string bug untouched"
          rationale: "Confirmed present but explicitly out of scope per the design doc"
      risks:
        - "create() fires AddTasks(workItemId) once per ID with no coordination when context.workItemIds has multiple IDs — progress-dialog design (single pair vs. one pair per ID) needs clarification"
        - "Zero automated tests exist — verification of caching/keepalive/dialog behavior will be manual only"
        - "Exact REST endpoint URLs/api-version for createWorkItem/updateWorkItem are not locally derivable — must be captured via live devtools network inspection, not guessed"
      artifacts:
        - path: analysis/codebase-analysis.md
          label: "Codebase Analysis Report"
          html: null
    clarifications:
      - decision: "Live ADO org access confirmed"
        rationale: "REST endpoint/api-version for fetch(keepalive:true) will be captured via live devtools network inspection, not guessed"
      - decision: "Ship the partial (non-100%-guaranteed) popup-close fix as designed (ADR-002)"
        rationale: "Hub/Hybrid full-guarantee architecture stays a deferred future escalation, not built now"
      - decision: "One start/completion dialog pair per work item for multi-ID selections"
        rationale: "Matches existing per-ID AddTasks(workItemId) independence"
      - decision: "Completion dialog surfaces a partial-failure summary instead of staying console-only"
        rationale: "New user-facing surface; matches the design's success criteria"
      - decision: "Split the ENTIRE app.ts into a multi-file module structure (user-added mid-Phase-1 scope)"
        rationale: "User judged the single 629-line file (already growing with 5 new components) no longer viable; explicitly chose whole-file modularization over touched-code-only or defer-to-separate-task options. The completed TypeScript migration task kept app.ts monolithic — modularization was out of its scope."
    gap_analysis:
      integration_points:
        - "toolbar.html:21 VSS.require(['scripts/app']) — entry point module id must not change"
        - "app.ts:38-48 getTeamSettings/getWorkItem — parallelize"
        - "app.ts:61-65 per-template chain — split into independent/ordered groups + Template Cache + Template Classifier insertion"
        - "app.ts:104-199 createWorkItem — swap to Keepalive Fetch Client; add failure-result propagation"
        - "app.ts:201-229 linkItems — swap to Keepalive Fetch Client"
        - "app.ts:495-538 getTemplate/getTemplates — cache-check-first wrapper"
        - "app.ts:611-628 create — wire start dialog, per-work-item AddTasks, completion dialog"
        - "Modularization: entire file relocated into ~13 files; shared ctx module state crosses file boundaries for the first time"
      summary: >
        No platform-level gaps for the 5 speed-up/reliability changes — pure implementation
        work, mostly net-new code. The user-added modularization is the dominant risk driver:
        touches every function in the 629-line file (including ones the research called
        "unaffected"), on zero test coverage, and surfaces a real structural hazard (shared
        module-level ctx state crossing new file boundaries). Risk level: High.
      decisions:
        - decision: "Treat the 5 behavioral changes and modularization as orthogonal gaps, reasoned about separately"
          rationale: "One is behavior-preserving-by-definition (modularization), the other deliberately changes behavior"
        - decision: "Model the module split around the research design's existing Key Components table (~13 files)"
          rationale: "Reuses design work already done rather than inventing a new boundary scheme"
        - decision: "Flag the module-level ctx global as a first-class structural risk, not a footnote"
          rationale: "Read by functions the research called 'unaffected'; any module split touches their file location/import surface"
      risks:
        - "4-hour localStorage TTL cache has no manual clear-cache affordance — already-accepted trade-off from research (ADR-003), not a new decision"
        - "GetChildTypes/createWorkItem call VSS.getWebContext() directly instead of reusing ctx — pre-existing inconsistency the module split must preserve exactly, not clean up as a drive-by"
        - "AMD/RequireJS cross-file relative import resolution has never been exercised in this repo (currently one .ts file) — recommend smoke-testing with the first extracted file before committing to the full ~13-file split"
      artifacts:
        - path: analysis/gap-analysis.md
          label: "Gap Analysis"
          html: null
    scope_clarifications:
      scope_expanded: true
      summary: >
        6 decisions resolved (all recommended defaults): modularize app.ts into ~13 files
        FIRST as a pure behavior-preserving refactor, then implement the 5 behavioral
        changes; ctx stays as shared exported module state; flat file layout; shared
        types.ts; ctx-vs-VSS.getWebContext() inconsistency preserved as-is; ~13-file
        granularity kept as proposed.
      decisions:
        - decision: "Modularize app.ts first, then implement the 5 behavioral changes"
          rationale: "Separates refactor risk from behavioral risk into two independently-verifiable passes — the only bisection lever with zero test coverage"
        - decision: "Shared ctx becomes export let ctx in context.ts, imported directly"
          rationale: "Minimal diff, no signature changes to functions the research called untouched"
        - decision: "Flat file layout under src/scripts/, no subfolder"
          rationale: "13 files doesn't yet justify extra directory structure"
        - decision: "Extract shared types into types.ts"
          rationale: "Needed by nearly every proposed module; avoids duplicate/drifting type declarations"
        - decision: "Preserve the ctx-vs-VSS.getWebContext() inconsistency exactly as-is"
          rationale: "Normalization is out of scope; avoids conflating an unrelated behavior change with a behavior-preserving refactor"
        - decision: "Keep the ~13-file module granularity as proposed"
          rationale: "Mirrors design work already done in high-level-design.md's Key Components table"
      risks: []
      artifacts:
        - path: analysis/scope-clarifications.md
          label: "Scope Clarifications"
          html: null
    ui_mockups: {components_designed: [], summary: null, decisions: [], risks: [], artifacts: []}
    specification:
      summary: >
        17 core requirements (5 modularization + 7 behavioral + 5 explicitly-not-changed
        guardrails) organized as Phase A (behavior-preserving refactor into ~13 flat files,
        independently verified) then Phase B (5 behavioral changes into the new structure,
        native Promise/async-await). app.ts keeps its exact path/AMD id/export signature.
        No external precedent for the 6 new components — genuinely greenfield.
      decisions:
        - decision: "Modularize first, then add behavior (Phase A -> Phase B)"
          rationale: "Only bisection lever between refactor risk and behavioral risk with zero test coverage"
        - decision: "Extraction incremental: logging.ts/types.ts/context.ts first to smoke-test AMD cross-file imports"
          rationale: "Pattern never exercised in this single-file repo before"
        - decision: "Native Promise/async-await for all new/touched code; Q stays only in untouched pure helpers"
          rationale: "ES2015 target already supports it with zero config changes; no unscoped conversion sweep"
      risks:
        - "Exact REST endpoint/api-version for the Keepalive Fetch Client must be captured live via devtools before that component can be implemented — hard implementation-time dependency"
        - "Popup-close survival remains partial by design (ADR-002) — Green-gate check must verify the narrower accepted outcome, not 100% survival"
        - "AMD/RequireJS cross-file relative import resolution never exercised in this repo — incremental extraction order exists to surface this risk early"
      artifacts:
