    implementation_plan:
      summary: >
        10 task groups, 59 steps, ~49-59 manual verification checks (no automated test
        framework). Group 1 (logging/types/context extraction) is a hard AMD-import
        smoke-test gate before Groups 2-4 finish Phase A; Group 4's full-split smoke test
        gates all of Phase B. Groups 5-8 (auth+keepalive, cache, classifier, dialogs) build
        independently in parallel, converging in Group 9 (orchestrator integration).
        Group 10 closes gaps against the spec's 9 success criteria.
      decisions:
