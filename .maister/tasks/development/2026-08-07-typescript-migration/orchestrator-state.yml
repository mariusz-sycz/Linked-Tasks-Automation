    specification:
      summary: "Port app.js to strict TypeScript, module: amd emitted in-place at scripts/app.js, tsc via grunt-exec wired into both packaging paths, bundling the 3 pre-decided bug fixes plus 4 roadmap cleanup items. Self-verification caught one new orphaned import (_WorkItemServices) and resolved the version-alignment direction (package.json adopts 1.1.17, not the reverse)."
      decisions:
        - decision: "declare const VSS covers only the 4 methods actually called"
          rationale: "No speculative surface for unused VSS APIs, per minimal-implementation standard"
        - decision: "Compiled output emits in place, no outDir/rootDir remap"
          rationale: "app.ts at src/scripts/app.ts emits directly back to src/scripts/app.js — zero manifest/HTML changes required"
        - decision: "TFS/WorkItemTracking/Services (_WorkItemServices) added to the delete list"
          rationale: "Used only inside the dead getWorkItemFormService function; orphaned by the same zero-references logic Q2 already established"
        - decision: "package.json version becomes 1.1.17, not the reverse"
          rationale: "vss-extension.json's 1.1.17 is already published to the Marketplace; rolling it back would misrepresent a shipped version"
        - decision: "AMD module contract preserved at the behavioral level, not literal source-shape"
          rationale: "tsc's AMD emit populates a generated exports object rather than literal return {create}; loader-level contract is unaffected"
      risks:
        - "tsc's AMD-emit shape change — manual checklist must exercise toolbar.html's VSS.require call path end to end, not just individual functions"
        - "Build-wiring dual-verification is a hard acceptance gate — partial wiring is a silent-failure mode with zero test coverage to catch it"
