  research_reference:
    path: .maister/tasks/research/2026-08-07-typescript-migration-approach
    research_question: "What is the best approach for migrating the Linked-Tasks-Automation Azure DevOps extension (AMD/RequireJS, Grunt build, VSS SDK, Q promises, no tests) to TypeScript — including tooling choices, incremental vs. big-bang strategy, and type definitions for the VSS SDK?"
    research_type: mixed
    confidence_level: high
  design_reference:
    source: null
    product_design_path: null
    mockup_count: 0
    has_brief: false
    index_path: null
  project_doc_paths:
    - .maister/docs/project/vision.md
    - .maister/docs/project/roadmap.md
    - .maister/docs/project/tech-stack.md
  phase_summaries:
    research:
      summary: "Compile with tsc via grunt-exec (not unmaintained grunt-ts), AMD output unchanged at scripts/app.js. Bootstrap app.js with JSDoc + allowJs/checkJs first, then single-shot rename to .ts (single-file codebase, classic multi-file incremental doesn't apply). Type VSS SDK via its own bundled typings/ (vss.d.ts, tfs.d.ts) — no DefinitelyTyped needed — plus one ambient `declare const VSS` for the non-AMD global. Type Q via current @types/q (v1.5.8, TS 4.5+). No-test-suite risk has no tooling fix — mitigate via small reversible commits and manual side-by-side .vsix verification checklist. Do not adopt azure-devops-extension-sdk (not a drop-in). Pre-existing bugs will surface during migration: 3 dead AMD imports (Controls, StatusIndicator, Dialogs), duplicate logging functions (Log/WriteTrace/WriteLog byte-identical), 2 implicit-global bugs (app.js:459, app.js:526), 1 dead function with a sync-return-of-async-value bug (getWorkItemFormService)."
      key_findings:
        - "VSS SDK ships its own bundled .d.ts typings (vss.d.ts, tfs.d.ts, rmo.d.ts) covering the exact modules used — no DefinitelyTyped or hand-rolled types needed"
        - "Global VSS object is not an AMD dependency — loaded via <script> tag in toolbar.html, needs ambient `declare const VSS`"
        - "grunt-ts is unmaintained; tsc via the already-installed grunt-exec is the lower-overhead build integration"
        - "@types/q is current (v1.5.8, Nov 2023, targets TS 4.5+) — no staleness problem"
        - "Q is not an npm dependency; resolved entirely via the VSS SDK's internal AMD loader, not npm's module graph"
        - "3 dead AMD imports (Controls, StatusIndicator, Dialogs) and 1 dead function (getWorkItemFormService) — candidates for deletion during the port"
        - "No TS/lint tooling exists today — clean slate, nothing to reconcile"
        - "azure-devops-extension-sdk (newer SDK) is not a drop-in replacement — stays out of scope"
        - "Single 617-line file means classic multi-file incremental migration literature doesn't transplant directly — adapted strategy is JSDoc/checkJs bootstrap then single-shot .ts rename"
        - "No-test-suite risk has no tooling substitute — literature converges on process discipline (small commits, manual characterization-style verification)"
      recommended_approach: "Add typescript + @types/q as devDependencies. Reference SDK types via \"types\": [\"vss-web-extension-sdk\"] in tsconfig.json. Add a declare const VSS ambient block. Compile via a new grunt-exec target (tsc -p tsconfig.json) inserted ahead of exec:package_dev/exec:package_release, with output landing at the unchanged src/scripts/app.js path (module: amd). Bootstrap app.js with JSDoc + allowJs/checkJs, resolve everything the compiler surfaces (including pre-existing bugs), then perform a single-shot rename to app.ts. Delete the 3 dead AMD imports and 1 dead function during the port. Build a manual verification checklist (one line per cataloged function) and exercise it against a real/sandbox .vsix before and after migration."
      decisions:
        - decision: "Use grunt-exec + direct tsc invocation, not grunt-ts"
          rationale: "grunt-ts is unmaintained; grunt-exec is already a dependency"
        - decision: "JSDoc/checkJs bootstrap, then single-shot .ts rename"
          rationale: "Nothing to incrementalize across in a single-file module; unguarded big-bang rename skips compiler feedback"
        - decision: "Type the VSS SDK from its own bundled typings/, not DefinitelyTyped"
          rationale: "vss-web-extension-sdk ships vss.d.ts, tfs.d.ts, rmo.d.ts covering the exact modules used"
        - decision: "Keep @types/q; treat Q-to-native-Promise conversion as optional follow-up"
          rationale: "@types/q v1.5.8 (Nov 2023) is current and targets TS 4.5+"
        - decision: "Do not adopt azure-devops-extension-sdk as part of this migration"
          rationale: "Confirmed not a drop-in replacement — distinct, larger, non-drop-in migration"
      risks:
        - "No-test-suite mitigation pattern and Q-to-native-Promise recommendation rest on WebSearch summaries only — directionally reliable, not verbatim-sourced"
        - "azure-devops-extension-sdk's exact npm publish date could not be cross-verified"
        - "Installed SDK version is 1.110.0 per lockfile, not ^1.104.0 as referenced in project docs — should be reconciled opportunistically"
      artifacts:
        - path: analysis/research-context/research-report.md
          label: "Research Report"
          html: analysis/research-context/research-report.html
        - path: analysis/research-context/synthesis.md
          label: "Research Synthesis"
          html: null
    design: {summary: null, screen_count: 0, component_count: 0, index_path: null}
    codebase_analysis:
      key_files: ["src/scripts/app.js", "src/toolbar.html", "src/vss-extension.json", "src/gruntfile.js", "src/package.json"]
      primary_language: "JavaScript (ES6+, AMD)"
      summary: "Confirmed current-state baseline: single 617-line AMD module, zero TS, zero tests, clean tooling slate. Corroborates prior research 1:1. New finding: broken sequential-promise-chain bug in AddTasks/createChildFromTemplate/createWorkItem — missing return statements mean templates aren't actually processed one-at-a-time as the code implies."
      decisions:
        - decision: "Confirm, don't repeat, the research report's tooling/typing choices"
          rationale: "This analysis independently re-derived the same facts from the live file tree — strong cross-validation"
        - decision: "Treat the newly-found broken-chain bug as an explicit migration decision point, not a silent fix"
          rationale: "Async typing will force the missing return statements into the open; needs an explicit fix-or-preserve call"
        - decision: "Do not carry Controls/StatusIndicator/Dialogs/_WorkItemServices into the typed dependency list unless UI feedback is added"
          rationale: "All four AMD imports are dead in the current code"
      risks:
